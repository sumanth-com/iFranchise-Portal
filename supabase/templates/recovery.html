<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reset Your iFranchise Password</title>
  </head>
  <body
    style="
      margin: 0;
      padding: 0;
      background-color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto,
        Helvetica, Arial, sans-serif;
      color: #0f172a;
    "
  >
    <table
      role="presentation"
      width="100%"
      cellspacing="0"
      cellpadding="0"
      style="background-color: #f8fafc; padding: 32px 16px"
    >
      <tr>
        <td align="center">
          <table
            role="presentation"
            width="100%"
            cellspacing="0"
            cellpadding="0"
            style="
              max-width: 560px;
              background: #ffffff;
              border-radius: 16px;
              border: 1px solid #e2e8f0;
              overflow: hidden;
              box-shadow: 0 12px 40px rgba(15, 23, 42, 0.08);
            "
          >
            <tr>
              <td
                style="
                  padding: 28px 32px 12px;
                  text-align: center;
                  background: linear-gradient(135deg, #6d28d9 0%, #4f46e5 100%);
                "
              >
                <div
                  style="
                    display: inline-block;
                    font-size: 22px;
                    font-weight: 800;
                    letter-spacing: -0.02em;
                    color: #ffffff;
                  "
                >
                  iFranchise
                </div>
              </td>
            </tr>
            <tr>
              <td style="padding: 32px">
                <p style="margin: 0 0 16px; font-size: 16px; line-height: 1.6">
                  Hello,
                </p>
                <p style="margin: 0 0 16px; font-size: 15px; line-height: 1.7; color: #334155">
                  We received a request to reset your iFranchise password.
                </p>
                <p style="margin: 0 0 28px; font-size: 15px; line-height: 1.7; color: #334155">
                  Click below to create a new password.
                </p>
                <table role="presentation" cellspacing="0" cellpadding="0">
                  <tr>
                    <td
                      style="
                        border-radius: 12px;
                        background: #6d28d9;
                      "
                    >
                      <a
                        href="{{ .ConfirmationURL }}"
                        style="
                          display: inline-block;
                          padding: 14px 28px;
                          font-size: 15px;
                          font-weight: 600;
                          color: #ffffff;
                          text-decoration: none;
                        "
                        >Reset Password</a
                      >
                    </td>
                  </tr>
                </table>
                <p
                  style="
                    margin: 28px 0 0;
                    font-size: 13px;
                    line-height: 1.6;
                    color: #64748b;
                  "
                >
                  If you did not request this change, you may safely ignore this
                  email.
                </p>
                <p
                  style="
                    margin: 24px 0 0;
                    font-size: 14px;
                    line-height: 1.6;
                    color: #334155;
                  "
                >
                  Regards,<br />
                  iFranchise Team
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
